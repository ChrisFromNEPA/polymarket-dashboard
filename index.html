<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Forecasting Agent — Live Experiment</title>
<meta name="description" content="Can an autonomous AI agent forecast prediction markets better than the market? A long-running paper-trading experiment scored on Brier vs. market, not P&amp;L.">
<meta property="og:title" content="Polymarket Forecasting Agent">
<meta property="og:description" content="A long-running experiment testing whether an autonomous AI agent can out-forecast Polymarket. Fake money only.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="header">
  <div class="brand">
    <h1>🔬 Polymarket Forecasting Agent</h1>
    <span class="badge badge-muted">Fake money · Experiment</span>
  </div>
  <nav id="tabs" role="tablist">
    <button class="tab active" data-view="verdict" role="tab">Verdict</button>
    <button class="tab" data-view="calibration" role="tab">Calibration</button>
    <button class="tab" data-view="decisions" role="tab">Decisions</button>
    <button class="tab" data-view="positions" role="tab">Positions</button>
    <button class="tab" data-view="resolutions" role="tab">Resolutions</button>
    <button class="tab" data-view="integrity" role="tab">Integrity</button>
  </nav>
</header>

<main id="main">
  <section id="view-verdict" class="view active" role="tabpanel">
    <div class="empty"><div class="empty-title">Loading agent state…</div>
    <div class="empty-detail">If this message persists, JavaScript failed to run
    or <code>state/*.json</code> could not be fetched.</div></div>
  </section>
  <section id="view-calibration" class="view" role="tabpanel"></section>
  <section id="view-decisions" class="view" role="tabpanel"></section>
  <section id="view-positions" class="view" role="tabpanel"></section>
  <section id="view-resolutions" class="view" role="tabpanel"></section>
  <section id="view-integrity" class="view" role="tabpanel"></section>
</main>

<footer id="footer">
  <span>
    Paper trading only — no wallet, no real orders.
    Scored on <strong>Brier vs. market</strong>, not P&amp;L.
  </span>
  <span class="footer-links">
    <a href="https://github.com/ChrisFromNEPA/polymarket-dashboard">Source</a>
    <a href="https://github.com/ChrisFromNEPA/polymarket-dashboard/blob/main/PLAN.md">Plan</a>
    <a href="https://github.com/ChrisFromNEPA/polymarket-dashboard/blob/main/reports/STATUS.md">Build log</a>
  </span>
</footer>

<script src="js/charts.js"></script>
<script src="js/data.js"></script>
<script src="js/integrity.js"></script>
<script src="js/views/verdict.js"></script>
<script src="js/views/calibration.js"></script>
<script src="js/views/decisions.js"></script>
<script src="js/views/positions.js"></script>
<script src="js/views/resolutions.js"></script>
<script src="js/views/integrity.js"></script>
<script src="js/app.js"></script>
</body>
</html>
